name: Deploy Todo List PWA

on:
  push:
    branches:
      - main
    paths:
      - "atv_03-todo_list/**"
      - ".github/workflows/deploy-todo-list.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atv_03-todo_list/package-lock.json

      - name: Instalar dependências
        working-directory: atv_03-todo_list
        run: npm ci

      - name: Compilar projeto
        working-directory: atv_03-todo_list
        run: npm run build

      - name: Preparar arquivos para publicação
        run: |
          mkdir -p _site/atv_03-todo_list
          cp -r atv_03-todo_list/dist/. _site/atv_03-todo_list/

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
